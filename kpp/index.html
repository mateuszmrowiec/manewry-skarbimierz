<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test KPP — chwilowo wyłączony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E8E9E4;
    --ink:#1C2321;
    --terrain:#6B7C6E;
    --slate:#4A5551;
    --signal:#FFD400;
    --rule:#C3C7BE;
    --bad:#9B3B2E;
    --bad-bg:#F1DBD6;
    --measure:64ch;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Literata",Georgia,serif;
    font-size:17px;
    line-height:1.62;
  }

  a{color:var(--ink);text-decoration-color:var(--terrain);text-underline-offset:3px;}
  a:hover{text-decoration-color:var(--ink);}
  a:focus-visible{outline:3px solid var(--ink);outline-offset:2px;background:var(--signal);}

  .wrap{max-width:860px;margin:0 auto;padding:0 24px;}

  header.masthead{
    border-bottom:2px solid var(--ink);
    padding:56px 0 32px;
  }
  .kicker{
    font-family:"Archivo Narrow",Arial Narrow,sans-serif;
    font-weight:600;font-size:16px;letter-spacing:.02em;
    color:var(--slate);margin:0 0 10px;
  }
  h1{
    font-family:"Archivo Narrow",Arial Narrow,sans-serif;
    font-weight:700;
    font-size:clamp(30px,6vw,50px);
    line-height:1.04;
    margin:0;
    max-width:20ch;
  }

  main{padding:44px 0 0;}

  .notice{
    background:var(--bad-bg);
    border-left:4px solid var(--bad);
    padding:20px 22px;
    margin:0;
    max-width:var(--measure);
  }
  .notice p{margin:0;font-size:18px;}
  .notice strong{font-weight:600;}

  .back{
    margin-top:38px;
    border-top:1px solid var(--rule);
    padding:22px 0 72px;
    max-width:var(--measure);
  }
  .back a{
    font-family:"Archivo Narrow",Arial Narrow,sans-serif;
    font-weight:700;font-size:18px;
  }

  @media (max-width:620px){
    body{font-size:16px;}
    .wrap{padding:0 18px;}
    header.masthead{padding:40px 0 26px;}
    main{padding-top:32px;}
    .notice{padding:16px 18px;}
    .notice p{font-size:17px;}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="kicker">Manewry Search &amp; Rescue Skarbimierz</p>
    <h1>Test KPP — chwilowo wyłączony</h1>
  </div>
</header>

<main>
  <div class="wrap">

    <div class="notice">
      <p><strong>W kluczu odpowiedzi znaleziono błędy.</strong> Test pozostaje
      wyłączony do czasu sprawdzenia całej bazy.</p>
    </div>

    <div class="back">
      <a href="../index.html">← Strona główna</a>
    </div>

  </div>
</main>

<!-- GoatCounter: cookieless analytics, no consent banner required -->
<script data-goatcounter="https://manewry-skarbimierz.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

</body>
</html>
